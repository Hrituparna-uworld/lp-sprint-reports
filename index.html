<script>const DATA = JSON.parse(document.getElementById('report-data').textContent);
const JIRA_BASE = 'https://uworld.atlassian.net/browse/';

function jlink(key){
  return `<a class="key-link" href="${JIRA_BASE}${key}" target="_blank" rel="noopener">${key}</a>`;
}
function teamBadge(team){
  const cls = team==='Solar'?'team-solar':team==='Hydro'?'team-hydro':team==='Aero'?'team-aero':'team-unassigned';
  return `<span class="badge ${cls}">${team}</span>`;
}
function tagBadges(tags){
  if(!tags || !tags.length) return '';
  return tags.map(t=>{
    if(t.includes('Production')) return `<span class="badge tag-prod">Prod Bug</span>`;
    if(t.includes('Unit')) return `<span class="badge tag-unit">Unit Test</span>`;
    if(t.includes('Customer')) return `<span class="badge tag-ce">Cust. Escalation</span>`;
    if(t.includes('Regression')) return `<span class="badge tag-reg">Regression</span>`;
    return `<span class="badge status">${t}</span>`;
  }).join('');
}
function fmtDate(iso){
  if(!iso) return '—';
  return iso.substring(0,10);
}
function fallbackNote(sig){
  if(sig==='creator-fallback') return `<div class="fallback-flag">team via QA creator (no label/sprint on item)</div>`;
  return '';
}

function storyTable(rows, opts={}){
  if(!rows.length) return `<div class="empty-state">No items in this category.</div>`;
  const showTeam = opts.showTeam !== false;
  let head = `<tr><th>Key</th><th>Summary</th><th>Status</th>${showTeam?'<th>Team</th>':''}<th>Assignee (Dev)</th><th>Creator (QA)</th><th>Created</th>${opts.showTags?'<th>Tags</th>':''}</tr>`;
  let body = rows.map(r=>`
    <tr>
      <td>${jlink(r.key)}</td>
      <td>${(r.summary||'').replace(/</g,'&lt;')}</td>
      <td><span class="badge status">${r.status}</span></td>
      ${showTeam?`<td>${teamBadge(r.team)}${fallbackNote(r.team_signal)}</td>`:''}
      <td>${r.assignee||'—'}</td>
      <td>${r.creator||'—'}</td>
      <td>${fmtDate(r.created)}</td>
      ${opts.showTags?`<td>${tagBadges(r.tags)}</td>`:''}
    </tr>`).join('');
  return `<table class="data"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function sectionTitle(text, count){
  return `<h2 class="section-title" id="${slug(text)}">${text} <span class="count-badge">${count}</span></h2>`;
}
function slug(s){ return 'sec-'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function filterByTeam(arr, team){ return arr.filter(x=>x.team===team); }

function buildSummary(){
  const totalStories = DATA.stories.length;
  const totalStoryBugs = DATA.storybugs_filter.length;
  const totalRegression = DATA.regression.length;
  const totalOtherWindow = DATA.other_window_storybug.length + DATA.other_window_standalone.length;
  const totalOrphan = DATA.orphan.length;
  const totalCE = DATA.customer_escalation.length;
  const totalProd = DATA.prod_bugs.length;
  const totalUnit = DATA.unit_test_bugs.length;

  const kpis = [
    {label:'Stories in scope', val:totalStories, cls:'', jump:'tab-Solar'},
    {label:'Story Bugs (filter scope)', val:totalStoryBugs, cls:'', jump:'sec-story-bugs-solar'},
    {label:'Regression-Identified Bugs', val:totalRegression, cls:'good', jump:'sec-regression-identified-solar'},
    {label:'Other-Window Bugs', val:totalOtherWindow, cls:'', jump:'sec-other-window-bugs-solar'},
    {label:'Orphan Bugs (no parent)', val:totalOrphan, cls:'danger', jump:'sec-orphan-bugs'},
    {label:'Customer Escalation', val:totalCE, cls:'danger', jump:'sec-customer-escalation'},
    {label:'QA-identified Prod Bugs', val:totalProd, cls:'danger', jump:'sec-production-bugs'},
    {label:'Unit Testing Bugs', val:totalUnit, cls:'', jump:'sec-unit-testing-bugs'},
  ];
  let kpiHtml = kpis.map(k=>`
    <div class="kpi ${k.cls}" onclick="jumpTo('${k.jump}')">
      <div class="num">${k.val}</div>
      <div class="lbl">${k.label}</div>
    </div>`).join('');

  let devRows = DATA.top_devs.map((d,i)=>`
    <tr><td>${i+1}</td><td>${d.name}</td><td>${teamBadge(d.team)}</td><td>${d.count}</td></tr>`).join('');

  let qaRows = DATA.top_qas.map((q,i)=>`
    <tr><td>${i+1}</td><td>${q.name}</td><td>${q.team==='Unmapped'?'<span class="badge status">Unmapped</span>':teamBadge(q.team)}</td><td>${q.count}</td></tr>`).join('');

  return `
    <p class="note">Project <b>UWLP</b> &middot; Stories via <a href="${DATA.meta.filter_url}" target="_blank">filter=17665</a> &middot;
    Regression ticket <b>${jlink(DATA.meta.regression_ticket)}</b> (${DATA.meta.regression_title}) &middot;
    Bug sweep window <b>${DATA.meta.window_start} → ${DATA.meta.window_end}</b> &middot;
    Customer Escalation parent <b>${jlink(DATA.meta.ce_parent)}</b> &middot; Closed-status items excluded throughout.</p>
    <div class="kpi-grid">${kpiHtml}</div>
    <div class="two-col">
      <div>
        <h2 class="section-title">Top 5 Developers <span class="count-badge">by Bug + Story Bug count</span></h2>
        <table class="data"><thead><tr><th>#</th><th>Developer</th><th>Team</th><th>Count</th></tr></thead><tbody>${devRows}</tbody></table>
      </div>
      <div>
        <h2 class="section-title">Top 5 QA <span class="count-badge">by Bug + Story Bug count</span></h2>
        <table class="data"><thead><tr><th>#</th><th>QA (Creator)</th><th>Team</th><th>Count</th></tr></thead><tbody>${qaRows}</tbody></table>
      </div>
    </div>
    ${sectionTitle('Customer Escalation Bugs', DATA.customer_escalation.length)}
    <p class="note">Bugs logged as a Child Work Item of ${jlink(DATA.meta.ce_parent)}, created within the ${DATA.meta.window_start} → ${DATA.meta.window_end} window.</p>
    ${storyTable(DATA.customer_escalation, {showTags:true})}
    ${sectionTitle('Orphan Bugs (no parent story)', DATA.orphan.length)}
    <p class="note">Standalone Bugs created in the sweep window with no parent/epic link at all.</p>
    ${storyTable(DATA.orphan, {showTags:true})}
    ${sectionTitle('QA-identified Production Bugs', DATA.prod_bugs.length)}
    <p class="note">Any in-scope Bug/Story Bug carrying the <code>Prod_bug</code> label.</p>
    ${storyTable(DATA.prod_bugs, {showTags:true})}
    ${sectionTitle('Unit Testing Bugs', DATA.unit_test_bugs.length)}
    <p class="note">Any in-scope Bug/Story Bug labeled <code>Unit-tests</code>, <code>UnitTest</code>, or <code>unit_tests_p1</code>.</p>
    ${storyTable(DATA.unit_test_bugs, {showTags:true})}
  `;
}

function buildTeamPanel(team){
  const stories = filterByTeam(DATA.stories, team);
  const storyBugs = filterByTeam(DATA.storybugs_filter, team);
  const regression = filterByTeam(DATA.regression, team);
  const otherWindow = filterByTeam(DATA.other_window_storybug, team).concat(filterByTeam(DATA.other_window_standalone, team));
  const suffix = team.toLowerCase().replace(/[^a-z]+/g,'-');

  return `
    <h2 class="section-title" id="sec-stories-${suffix}">Stories ${teamBadge(team)} <span class="count-badge">${stories.length}</span></h2>
    ${storyTable(stories, {showTeam:false})}
    <h2 class="section-title" id="sec-story-bugs-${suffix}">Story Bugs (subtasks of in-scope Stories) <span class="count-badge">${storyBugs.length}</span></h2>
    ${storyTable(storyBugs, {showTeam:false, showTags:true})}
    <h2 class="section-title" id="sec-regression-identified-${suffix}">Regression-Identified Bugs &amp; Story Bugs <span class="count-badge">${regression.length}</span></h2>
    <p class="note">Subtasks of ${jlink(DATA.meta.regression_ticket)} (${DATA.meta.regression_title}).</p>
    ${storyTable(regression, {showTeam:false, showTags:true})}
    <h2 class="section-title" id="sec-other-window-bugs-${suffix}">Other-Window Bugs <span class="count-badge">${otherWindow.length}</span></h2>
    <p class="note">Bugs/Story Bugs created ${DATA.meta.window_start} → ${DATA.meta.window_end} not already counted above.</p>
    ${storyTable(otherWindow, {showTeam:false, showTags:true})}
  `;
}

function buildAppendix(){
  const c = DATA.closed_counts;
  return `
    <h2 class="section-title">Excluded / Closed-status Accounting</h2>
    <p class="note">Closed-status Bugs and Story Bugs are removed from every list and count above.</p>
    <div class="appendix-grid">
      <div class="appendix-card"><div class="big">${c.filter_storybugs_closed} / ${c.filter_storybugs_total}</div><div class="small">Filter-scope Story Bugs excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.regression_closed} / ${c.regression_total}</div><div class="small">Regression-ticket subtasks excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.window_storybug_closed} / ${c.window_storybug_total}</div><div class="small">Date-window Story Bugs excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.window_bug_closed} / ${c.window_bug_total}</div><div class="small">Date-window standalone Bugs excluded (Closed)</div></div>
    </div>
    <h2 class="section-title">Methodology</h2>
    <ol class="method-list">
      <li><b>Stories</b> pulled via JQL <code>filter = 17665</code> (${DATA.stories.length} Stories).</li>
      <li><b>Story Bugs</b> = Bugs/Story Bugs from the Jul 13–24 sweep whose parent matches an in-scope Story key.</li>
      <li><b>Team classification</b>: label → sprint name → QA Creator roster fallback. Items with no signal = "Unassigned Team."</li>
      <li><b>Regression-Identified</b> = subtasks of ${jlink(DATA.meta.regression_ticket)} only.</li>
      <li><b>Customer Escalation</b> = Bugs whose parent is ${jlink(DATA.meta.ce_parent)}, created Jul 13–24.</li>
      <li><b>Orphan Bugs</b> = standalone Bug-type issues created in the window with no parent at all.</li>
      <li><b>Other-Window Bugs</b> = remaining Bug/Story Bug created in the window not already counted.</li>
      <li>Cross-cutting tags (Production Bug / Unit Testing Bug) applied wherever the relevant label is present.</li>
    </ol>
    <h2 class="section-title">QA → Team Roster Used</h2>
    <table class="data"><thead><tr><th>Team</th><th>QA (Creator) names</th></tr></thead><tbody>
      <tr><td>${teamBadge('Solar')}</td><td>Priyanka Sahany, Sunil Lekkala, Yesu Sampath Makkala, Anuja Kumar Panda, Manasini Balasani</td></tr>
      <tr><td>${teamBadge('Hydro')}</td><td>Vaishnavi Attely, Aravind Dussa, Dheeraj Gandikota, Manisha Goripati, Srivani Gogula</td></tr>
      <tr><td>${teamBadge('Aero')}</td><td>Gibi Babu, Srikanth Nimmala, Vinitha Thatikonda, Anil Tammiraju, Mahendra Pabbathi, Ramyasri Yalamati</td></tr>
      <tr><td><span class="badge status">Automation QA</span></td><td>Sowmya Sri Majji, Anvesh Koripalli</td></tr>
      <tr><td><span class="badge status">Team BA</span></td><td>Deepak Rangam, Abhishakth Kumar Kashimalla, Sooraj Suresh</td></tr>
    </tbody></table>
  `;
}

const TABS = [
  {id:'Summary',label:'Summary'},
  {id:'Solar',label:'Solar'},
  {id:'Hydro',label:'Hydro'},
  {id:'Aero',label:'Aero'},
  {id:'Unassigned Team',label:'Unassigned'},
  {id:'Appendix',label:'Appendix'},
];

function renderMeta(){
  document.getElementById('metaRow').innerHTML = `
    <span><b>${DATA.stories.length}</b> Stories</span>
    <span><b>${DATA.storybugs_filter.length}</b> Story Bugs</span>
    <span><b>${DATA.regression.length}</b> Regression-identified</span>
    <span><b>${DATA.orphan.length}</b> Orphan bugs</span>
    <span><b>${DATA.customer_escalation.length}</b> Customer escalations</span>
    <span><a href="${DATA.meta.filter_url}" target="_blank">Jira filter 17665 ↗</a></span>
    <span><a href="${JIRA_BASE}${DATA.meta.regression_ticket}" target="_blank">${DATA.meta.regression_ticket} ↗</a></span>
  `;
}

function renderTabs(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map((t,i)=>`<button data-team="${t.id}" class="${i===0?'active':''}" onclick="showTab('${t.id}')">${t.label}</button>`).join('');
}

function renderPanels(){
  const main = document.getElementById('mainContent');
  main.innerHTML = TABS.map((t,i)=>`<section class="panel ${i===0?'active':''}" id="panel-${t.id.replace(/[^a-zA-Z]+/g,'-')}"></section>`).join('');
  document.getElementById('panel-Summary').innerHTML = buildSummary();
  document.getElementById('panel-Solar').innerHTML = buildTeamPanel('Solar');
  document.getElementById('panel-Hydro').innerHTML = buildTeamPanel('Hydro');
  document.getElementById('panel-Aero').innerHTML = buildTeamPanel('Aero');
  document.getElementById('panel-Unassigned-Team').innerHTML = buildTeamPanel('Unassigned Team');
  document.getElementById('panel-Appendix').innerHTML = buildAppendix();
}

function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.team===id));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id.replace(/[^a-zA-Z]+/g,'-')).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}

function jumpTo(sectionId){
  const teamMap = {solar:'Solar',hydro:'Hydro',aero:'Aero'};
  let targetTab = 'Solar';
  for(const k in teamMap){ if(sectionId.endsWith('-'+k)) targetTab = teamMap[k]; }
  if(sectionId==='sec-orphan-bugs'||sectionId==='sec-customer-escalation'||sectionId==='sec-production-bugs'||sectionId==='sec-unit-testing-bugs'||sectionId==='tab-Solar'){
    targetTab = 'Summary';
  }
  showTab(targetTab);
  setTimeout(()=>{
    const el = document.getElementById(sectionId);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },50);
}

renderMeta();
renderTabs();
renderPanels();
</script>
</body>
</html>
