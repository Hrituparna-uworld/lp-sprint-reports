<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6675;
    --paper:#f6f7f9;
    --card:#ffffff;
    --line:#e3e7ed;
    --solar:#c9720a;
    --solar-bg:#fdf1e2;
    --hydro:#0f6e8c;
    --hydro-bg:#e6f4f8;
    --aero:#5b4bb8;
    --aero-bg:#efecfb;
    --unassigned:#6b7280;
    --unassigned-bg:#eef0f2;
    --danger:#b3261e;
    --danger-bg:#fbe9e8;
    --good:#1a7a4c;
    --good-bg:#e7f5ee;
    --accent:#1c2430;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
  }
  header.top{
    background:linear-gradient(135deg,#1c2430 0%,#2c3444 100%);
    color:#fff;
    padding:28px 32px 22px;
  }
  header.top h1{
    margin:0 0 4px;
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:.2px;
  }
  header.top .sub{
    color:#c7ccd6;
    font-size:.92rem;
  }
  header.top .meta-row{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    font-size:.82rem;
    color:#dfe3ea;
  }
  header.top .meta-row b{color:#fff;}
  header.top a{color:#a9d4ff; text-decoration:none;}
  header.top a:hover{text-decoration:underline;}

  nav.tabs{
    position:sticky; top:0; z-index:50;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    gap:4px;
    padding:0 24px;
    overflow-x:auto;
    box-shadow:0 2px 6px rgba(20,25,35,.05);
  }
  nav.tabs button{
    border:none;
    background:transparent;
    padding:14px 16px;
    font-size:.92rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--ink); }
  nav.tabs button[data-team="Solar"].active{ color:var(--solar); border-bottom-color:var(--solar); }
  nav.tabs button[data-team="Hydro"].active{ color:var(--hydro); border-bottom-color:var(--hydro); }
  nav.tabs button[data-team="Aero"].active{ color:var(--aero); border-bottom-color:var(--aero); }
  nav.tabs button[data-team="Unassigned Team"].active{ color:var(--unassigned); border-bottom-color:var(--unassigned); }

  main{ padding:24px 32px 64px; max-width:1280px; margin:0 auto; }
  section.panel{ display:none; }
  section.panel.active{ display:block; }

  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin:18px 0 28px;
  }
  .kpi{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    cursor:pointer;
    transition:box-shadow .15s, transform .15s;
  }
  .kpi:hover{ box-shadow:0 4px 14px rgba(20,25,35,.08); transform:translateY(-1px); }
  .kpi .num{ font-size:1.65rem; font-weight:700; }
  .kpi .lbl{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; }
  .kpi.solar .num{color:var(--solar);}
  .kpi.hydro .num{color:var(--hydro);}
  .kpi.aero .num{color:var(--aero);}
  .kpi.danger .num{color:var(--danger);}
  .kpi.good .num{color:var(--good);}

  h2.section-title{
    font-size:1.15rem;
    margin:34px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  h2.section-title .count-badge{
    font-size:.78rem;
    background:var(--ink);
    color:#fff;
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
  }
  p.note{ color:var(--ink-soft); font-size:.85rem; margin:-4px 0 14px; }

  table.data{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:.83rem;
    margin-bottom:8px;
  }
  table.data thead th{
    background:#f0f2f5;
    text-align:left;
    padding:9px 12px;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.data tbody td{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  table.data tbody tr:last-child td{ border-bottom:none; }
  table.data tbody tr:hover{ background:#fafbfc; }
  table.data a.key-link{ color:var(--ink); font-weight:700; text-decoration:none; }
  table.data a.key-link:hover{ text-decoration:underline; }

  .badge{
    display:inline-block;
    font-size:.68rem;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
    margin:1px 3px 1px 0;
    white-space:nowrap;
  }
  .badge.team-solar{ background:var(--solar-bg); color:var(--solar); }
  .badge.team-hydro{ background:var(--hydro-bg); color:var(--hydro); }
  .badge.team-aero{ background:var(--aero-bg); color:var(--aero); }
  .badge.team-unassigned{ background:var(--unassigned-bg); color:var(--unassigned); }
  .badge.tag-prod{ background:var(--danger-bg); color:var(--danger); }
  .badge.tag-unit{ background:#eef2ff; color:#3b4bb8; }
  .badge.tag-ce{ background:#fff4e0; color:#946200; }
  .badge.tag-reg{ background:#e9f7ee; color:var(--good); }
  .badge.status{ background:#eef0f2; color:var(--ink-soft); }
  .fallback-flag{ font-size:.68rem; color:#b3261e; font-style:italic; }

  .empty-state{
    padding:22px;
    text-align:center;
    color:var(--ink-soft);
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:.88rem;
  }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media(max-width:860px){ .two-col{grid-template-columns:1fr;} }

  ol.method-list{ font-size:.86rem; color:var(--ink-soft); padding-left:20px; }
  ol.method-list li{ margin-bottom:8px; }

  .appendix-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px; margin:14px 0 24px;
  }
  .appendix-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px;
  }
  .appendix-card .big{ font-size:1.3rem; font-weight:700; }
  .appendix-card .small{ font-size:.78rem; color:var(--ink-soft); }

  footer{
    text-align:center; color:var(--ink-soft); font-size:.78rem; padding:20px; border-top:1px solid var(--line);
  }
  .back-to-top{
    display:inline-block; margin-top:6px; font-size:.78rem; color:var(--ink-soft); cursor:pointer; text-decoration:underline;
  }
</style>

<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const JIRA_BASE = 'https://uworld.atlassian.net/browse/';

function jlink(key){
  return `<a class="key-link" href="${JIRA_BASE}${key}" target="_blank" rel="noopener">${key}</a>`;
}
function teamBadge(team){
  const cls = team==='Solar'?'team-solar':team==='Hydro'?'team-hydro':team==='Aero'?'team-aero':'team-unassigned';
  return `<span class="badge ${cls}">${team}</span>`;
}
function tagBadges(tags){
  if(!tags || !tags.length) return '';
  return tags.map(t=>{
    if(t.includes('Production')) return `<span class="badge tag-prod">Prod Bug</span>`;
    if(t.includes('Unit')) return `<span class="badge tag-unit">Unit Test</span>`;
    if(t.includes('Customer')) return `<span class="badge tag-ce">Cust. Escalation</span>`;
    if(t.includes('Regression')) return `<span class="badge tag-reg">Regression</span>`;
    return `<span class="badge status">${t}</span>`;
  }).join('');
}
function fmtDate(iso){
  if(!iso) return '—';
  return iso.substring(0,10);
}
function fallbackNote(sig){
  if(sig==='creator-fallback') return `<div class="fallback-flag">team via QA creator (no label/sprint on item)</div>`;
  return '';
}

// ---------- table builders ----------
function storyTable(rows, opts={}){
  if(!rows.length) return `<div class="empty-state">No items in this category.</div>`;
  const showTeam = opts.showTeam !== false;
  let head = `<tr><th>Key</th><th>Summary</th><th>Status</th>${showTeam?'<th>Team</th>':''}<th>Assignee (Dev)</th><th>Creator (QA)</th><th>Created</th>${opts.showTags?'<th>Tags</th>':''}</tr>`;
  let body = rows.map(r=>`
    <tr>
      <td>${jlink(r.key)}</td>
      <td>${(r.summary||'').replace(/</g,'&lt;')}</td>
      <td><span class="badge status">${r.status}</span></td>
      ${showTeam?`<td>${teamBadge(r.team)}${fallbackNote(r.team_signal)}</td>`:''}
      <td>${r.assignee||'—'}</td>
      <td>${r.creator||'—'}</td>
      <td>${fmtDate(r.created)}</td>
      ${opts.showTags?`<td>${tagBadges(r.tags)}</td>`:''}
    </tr>`).join('');
  return `<table class="data"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function sectionTitle(text, count){
  return `<h2 class="section-title" id="${slug(text)}">${text} <span class="count-badge">${count}</span></h2>`;
}
function slug(s){ return 'sec-'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function filterByTeam(arr, team){ return arr.filter(x=>x.team===team); }

// ---------- Summary panel ----------
function buildSummary(){
  const totalStories = DATA.stories.length;
  const totalStoryBugs = DATA.storybugs_filter.length;
  const totalRegression = DATA.regression.length;
  const totalOtherWindow = DATA.other_window_storybug.length + DATA.other_window_standalone.length + DATA.customer_escalation.length;
  const totalOrphan = DATA.orphan.length;
  const totalCE = DATA.customer_escalation.length;
  const totalProd = DATA.prod_bugs.length;
  const totalUnit = DATA.unit_test_bugs.length;

  const kpis = [
    {label:'Stories in scope', val:totalStories, cls:'', jump:'tab-Solar'},
    {label:'Story Bugs (filter scope)', val:totalStoryBugs, cls:'', jump:'sec-story-bugs-solar'},
    {label:'Regression-Identified Bugs', val:totalRegression, cls:'good', jump:'sec-regression-identified-solar'},
    {label:'Other-Window Bugs', val:totalOtherWindow, cls:'', jump:'sec-other-window-bugs-solar'},
    {label:'Orphan Bugs (no parent)', val:totalOrphan, cls:'danger', jump:'sec-orphan-bugs'},
    {label:'Customer Escalation', val:totalCE, cls:'danger', jump:'sec-customer-escalation'},
    {label:'QA-identified Prod Bugs', val:totalProd, cls:'danger', jump:'sec-production-bugs'},
    {label:'Unit Testing Bugs', val:totalUnit, cls:'', jump:'sec-unit-testing-bugs'},
  ];
  let kpiHtml = kpis.map(k=>`
    <div class="kpi ${k.cls}" onclick="jumpTo('${k.jump}')">
      <div class="num">${k.val}</div>
      <div class="lbl">${k.label}</div>
    </div>`).join('');

  let devRows = DATA.top_devs.map((d,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${d.name}</td>
      <td>${teamBadge(d.team)}${d.split?'<div class="fallback-flag">tickets span multiple teams — majority shown</div>':''}</td>
      <td>${d.count}</td>
    </tr>`).join('');

  let qaRows = DATA.top_qas.map((q,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${q.name}</td>
      <td>${q.team==='Unmapped'?'<span class="badge status">Unmapped</span>':teamBadge(q.team)}</td>
      <td>${q.count}</td>
    </tr>`).join('');

  return `
    <p class="note">Project <b>UWLP</b> &middot; Stories via <a href="${DATA.meta.filter_url}" target="_blank">filter=17665</a> &middot;
    Regression ticket <b>${jlink(DATA.meta.regression_ticket)}</b> (${DATA.meta.regression_title}) &middot;
    Other-bug sweep window <b>${DATA.meta.window_start} → ${DATA.meta.window_end}</b> &middot;
    Customer Escalation parent <b>${jlink(DATA.meta.ce_parent)}</b> &middot; Closed-status items excluded throughout.</p>

    <div class="kpi-grid">${kpiHtml}</div>

    <div class="two-col">
      <div>
        <h2 class="section-title">Top 5 Developers <span class="count-badge">by Bug + Story Bug count</span></h2>
        <table class="data"><thead><tr><th>#</th><th>Developer</th><th>Team</th><th>Count</th></tr></thead><tbody>${devRows}</tbody></table>
      </div>
      <div>
        <h2 class="section-title">Top 5 QA <span class="count-badge">by Bug + Story Bug count</span></h2>
        <table class="data"><thead><tr><th>#</th><th>QA (Creator)</th><th>Team</th><th>Count</th></tr></thead><tbody>${qaRows}</tbody></table>
      </div>
    </div>

    ${sectionTitle('Customer Escalation Bugs', DATA.customer_escalation.length)}
    <p class="note">Bugs logged as a Child Work Item of ${jlink(DATA.meta.ce_parent)}, created within the ${DATA.meta.window_start} → ${DATA.meta.window_end} window.</p>
    ${storyTable(DATA.customer_escalation, {showTags:true})}

    ${sectionTitle('Orphan Bugs (no parent story)', DATA.orphan.length)}
    <p class="note">Standalone Bugs created in the sweep window with no parent/epic link at all.</p>
    ${storyTable(DATA.orphan, {showTags:true})}

    ${sectionTitle('QA-identified Production Bugs', DATA.prod_bugs.length)}
    <p class="note">Any in-scope Bug/Story Bug carrying the <code>Prod_bug</code> label.</p>
    ${storyTable(DATA.prod_bugs, {showTags:true})}

    ${sectionTitle('Unit Testing Bugs', DATA.unit_test_bugs.length)}
    <p class="note">Any in-scope Bug/Story Bug labeled <code>Unit-tests</code>, <code>UnitTest</code>, or <code>unit_tests_p1</code>.</p>
    ${storyTable(DATA.unit_test_bugs, {showTags:true})}
  `;
}

// ---------- Team panel ----------
function buildTeamPanel(team){
  const stories = filterByTeam(DATA.stories, team);
  const storyBugs = filterByTeam(DATA.storybugs_filter, team);
  const regression = filterByTeam(DATA.regression, team);
  const otherWindow = filterByTeam(DATA.other_window_storybug, team)
        .concat(filterByTeam(DATA.other_window_standalone, team))
        .concat(filterByTeam(DATA.customer_escalation, team));
  const suffix = team.toLowerCase().replace(/[^a-z]+/g,'-');

  return `
    <h2 class="section-title" id="sec-stories-${suffix}">Stories ${teamBadge(team)} <span class="count-badge">${stories.length}</span></h2>
    ${storyTable(stories, {showTeam:false})}

    <h2 class="section-title" id="sec-story-bugs-${suffix}">Story Bugs (subtasks of in-scope Stories) <span class="count-badge">${storyBugs.length}</span></h2>
    ${storyTable(storyBugs, {showTeam:false, showTags:true})}

    <h2 class="section-title" id="sec-regression-identified-${suffix}">Regression-Identified Bugs &amp; Story Bugs <span class="count-badge">${regression.length}</span></h2>
    <p class="note">Subtasks of ${jlink(DATA.meta.regression_ticket)} (${DATA.meta.regression_title}).</p>
    ${storyTable(regression, {showTeam:false, showTags:true})}

    <h2 class="section-title" id="sec-other-window-bugs-${suffix}">Other-Window Bugs <span class="count-badge">${otherWindow.length}</span></h2>
    <p class="note">Bugs/Story Bugs created ${DATA.meta.window_start} → ${DATA.meta.window_end} not already counted above (includes Customer Escalation items tagged accordingly).</p>
    ${storyTable(otherWindow, {showTeam:false, showTags:true})}
  `;
}

// ---------- Appendix panel ----------
function buildAppendix(){
  const c = DATA.closed_counts;
  return `
    <h2 class="section-title">Excluded / Closed-status Accounting</h2>
    <p class="note">Closed-status Bugs and Story Bugs are removed from every list and count above. Tallies below are kept for audit purposes.</p>
    <div class="appendix-grid">
      <div class="appendix-card"><div class="big">${c.filter_storybugs_closed} / ${c.filter_storybugs_total}</div><div class="small">Filter-scope Story Bugs excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.regression_closed} / ${c.regression_total}</div><div class="small">Regression-ticket subtasks excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.window_storybug_closed} / ${c.window_storybug_total}</div><div class="small">Date-window Story Bugs excluded (Closed)</div></div>
      <div class="appendix-card"><div class="big">${c.window_bug_closed} / ${c.window_bug_total}</div><div class="small">Date-window standalone Bugs excluded (Closed)</div></div>
    </div>

    <h2 class="section-title">Methodology</h2>
    <ol class="method-list">
      <li><b>Stories</b> pulled via JQL <code>filter = 17665</code> (${DATA.stories.length} Stories, none Closed).</li>
      <li><b>Story Bugs</b> = subtasks of those Stories whose issue type is literally "Story Bug" (the project's Sub Test Execution subtasks are QA tracking tickets, not bugs, and were excluded from bug counts).</li>
      <li><b>Team classification</b>: a Story/Bug is assigned a team if (a) it carries a label matching Solar/Hydro/Aero, or failing that (b) its Sprint name contains one of those words. Where neither signal exists on the item itself — this happens for most Regression-ticket subtasks and for one earlier regression cycle's leftover subtasks (Test Plan UWLP-47455) that fell inside the sweep window — the QA Creator's team (roster below) was used as a fallback, flagged inline as "team via QA creator". Items with no signal at all are "Unassigned Team".</li>
      <li><b>Regression-Identified</b> = subtasks of ${jlink(DATA.meta.regression_ticket)} only (per instruction, linked-but-not-subtask issues do not count as regression-identified even if they reference the regression ticket).</li>
      <li><b>Customer Escalation</b> = Bugs whose <i>parent</i> (Child Work Item / Epic link) is ${jlink(DATA.meta.ce_parent)}, created inside ${DATA.meta.window_start} → ${DATA.meta.window_end}.</li>
      <li><b>Orphan Bugs</b> = standalone Bug-type issues created in the same window with no parent/epic at all.</li>
      <li><b>Other-Window Bugs</b> = every remaining Bug/Story Bug created in the window that isn't a Regression-ticket subtask, isn't already one of the filter-scope Story Bugs, and isn't an orphan or Customer Escalation item.</li>
      <li>Cross-cutting tags (Production Bug / Unit Testing Bug) are applied on top of the above categories wherever the relevant label is present — an item can carry more than one tag.</li>
    </ol>

    <h2 class="section-title">QA → Team Roster Used</h2>
    <table class="data"><thead><tr><th>Team</th><th>QA (Creator) names</th></tr></thead><tbody>
      <tr><td>${teamBadge('Solar')}</td><td>Priyanka Sahany, Sunil Lekkala, Yesu Sampath Makkala, Anuja Kumar Panda</td></tr>
      <tr><td>${teamBadge('Hydro')}</td><td>Vaishnavi Attely, Aravind Dussa, Dheeraj Gandikota, Manisha Goripati</td></tr>
      <tr><td>${teamBadge('Aero')}</td><td>Gibi Babu, Srikanth Nimmala, Vinitha Thatikonda, Anil Tammiraju</td></tr>
      <tr><td><span class="badge status">Automation QA</span></td><td>Sowmya Sri Majji, Anvesh Koripalli</td></tr>
      <tr><td><span class="badge status">QA Intern</span></td><td>Mahendra Pabbathi, Manasini Balasani, Srivani Gogula, Ramyasri Yalamati</td></tr>
      <tr><td><span class="badge status">Team BA</span></td><td>Deepak Rangam, Abhishakth Kumar Kashimalla, Sooraj Suresh</td></tr>
    </tbody></table>
  `;
}

// ---------- App shell ----------
const TABS = [
  {id:'Summary', label:'Summary'},
  {id:'Solar', label:'Solar'},
  {id:'Hydro', label:'Hydro'},
  {id:'Aero', label:'Aero'},
  {id:'Unassigned Team', label:'Unassigned'},
  {id:'Appendix', label:'Appendix'},
];

function renderMeta(){
  document.getElementById('metaRow').innerHTML = `
    <span><b>${DATA.stories.length}</b> Stories</span>
    <span><b>${DATA.storybugs_filter.length}</b> Story Bugs</span>
    <span><b>${DATA.regression.length}</b> Regression-identified</span>
    <span><b>${DATA.orphan.length}</b> Orphan bugs</span>
    <span><b>${DATA.customer_escalation.length}</b> Customer escalations</span>
    <span><a href="${DATA.meta.filter_url}" target="_blank">Jira filter 17665 ↗</a></span>
    <span><a href="${JIRA_BASE}${DATA.meta.regression_ticket}" target="_blank">${DATA.meta.regression_ticket} ↗</a></span>
  `;
}

function renderTabs(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map((t,i)=>`<button data-team="${t.id}" class="${i===0?'active':''}" onclick="showTab('${t.id}')">${t.label}</button>`).join('');
}

function renderPanels(){
  const main = document.getElementById('mainContent');
  main.innerHTML = TABS.map((t,i)=>`<section class="panel ${i===0?'active':''}" id="panel-${t.id.replace(/[^a-zA-Z]+/g,'-')}"></section>`).join('');
  document.getElementById('panel-Summary').innerHTML = buildSummary();
  document.getElementById('panel-Solar').innerHTML = buildTeamPanel('Solar');
  document.getElementById('panel-Hydro').innerHTML = buildTeamPanel('Hydro');
  document.getElementById('panel-Aero').innerHTML = buildTeamPanel('Aero');
  document.getElementById('panel-Unassigned-Team').innerHTML = buildTeamPanel('Unassigned Team');
  document.getElementById('panel-Appendix').innerHTML = buildAppendix();
}

function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.team===id));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.remove('active'));
  const panelId = 'panel-'+id.replace(/[^a-zA-Z]+/g,'-');
  document.getElementById(panelId).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}

function jumpTo(sectionId){
  // sections live in team panels named like sec-story-bugs-solar; figure out which tab owns it
  const teamMap = {solar:'Solar', hydro:'Hydro', aero:'Aero'};
  let targetTab = 'Solar';
  for(const k in teamMap){ if(sectionId.endsWith('-'+k)) targetTab = teamMap[k]; }
  if(sectionId==='sec-orphan-bugs' || sectionId==='sec-customer-escalation' || sectionId==='sec-production-bugs' || sectionId==='sec-unit-testing-bugs' || sectionId==='tab-Solar'){
    targetTab = 'Summary';
  }
  showTab(targetTab);
  setTimeout(()=>{
    const el = document.getElementById(sectionId);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

renderMeta();
renderTabs();
renderPanels();
</script>
</body>
</html>
